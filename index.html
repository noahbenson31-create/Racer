<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Battle Racing</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:#fff}
canvas{display:block;margin:auto;background:#222}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#10152e,#050509);z-index:10}
#menu h1{font-size:clamp(35px,7vw,65px);margin:10px;text-shadow:0 0 20px cyan}
#menu p{color:#bbb;text-align:center}
button{padding:15px 35px;font-size:22px;border:0;border-radius:12px;cursor:pointer;background:#00d9ff;color:#001018;font-weight:bold;box-shadow:0 0 20px #00d9ff}
#hud{position:fixed;top:15px;left:15px;z-index:5;font-size:18px;line-height:1.6;text-shadow:2px 2px #000}
#message{position:fixed;top:38%;width:100%;text-align:center;font-size:50px;font-weight:bold;text-shadow:0 0 20px cyan;pointer-events:none;z-index:6}
#controls{position:fixed;bottom:10px;width:100%;text-align:center;color:#aaa;z-index:5}
#audioBtn{position:fixed;right:15px;top:15px;z-index:20;padding:8px 12px;font-size:14px;background:#222;color:#fff;box-shadow:none}
</style>
</head>
<body>
<button id="audioBtn" onclick="toggleAudio()">🔊 Audio ON</button><div id="menu"><h1>🏎️ TURBO BATTLE</h1><p>Race • Dodge • Blast • Win</p><p>WASD / Arrow Keys = Drive<br>SPACE = Fire • SHIFT/E = Boost</p><button onclick="startGame()">START RACE</button></div>
<div id="hud">🏁 Lap: <span id="lap">1</span>/3<br>❤️ Health: <span id="health">100</span><br>⛽ Fuel: <span id="fuel">100</span>%<br>⚡ Boost: <span id="boost">100%</span><br>🛡️ Shield: <span id="shield">OFF</span><br>🚀 Weapon: <span id="weapon">READY</span><br>🏆 Score: <span id="score">0</span></div>
<div id="message"></div><div id="controls">↑/W Accelerate • ↓/S Brake • ←/→/A/D Steer • SPACE Fire • SHIFT/E Boost</div>
<canvas id="game" width="1000" height="700"></canvas>
<script>

// ===== BUILT-IN SFX + MUSIC =====
let audioCtx=null, master=null, musicTimer=null, audioOn=true;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain(); master.gain.value=.18; master.connect(audioCtx.destination);
  startMusic();
}
function tone(freq,dur,type="square",vol=.08,when=0){
  if(!audioOn||!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime+when);
  g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);
  g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+when+.01);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);
  o.connect(g);g.connect(master);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.03);
}
function noise(dur=.12,vol=.12){
  if(!audioOn||!audioCtx)return;
  const n=audioCtx.createBufferSource(), b=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
  const data=b.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  n.buffer=b;const g=audioCtx.createGain();g.gain.value=vol;n.connect(g);g.connect(master);n.start();
}
function sfxBoost(){tone(220,.08,"sawtooth",.12);tone(440,.16,"sawtooth",.10,.06);tone(880,.22,"triangle",.08,.12)}
function sfxShoot(){tone(120,.07,"sawtooth",.15);noise(.08,.10)}
function sfxExplosion(){noise(.28,.22);tone(90,.25,"sawtooth",.12)}
function sfxPower(){tone(520,.08,"triangle",.09);tone(780,.12,"triangle",.08,.08);tone(1040,.18,"triangle",.07,.16)}
function sfxHit(){tone(75,.12,"square",.12);noise(.08,.07)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.09,i*.12))}
function sfxLose(){[440,330,220].forEach((f,i)=>tone(f,.25,"sawtooth",.08,i*.16))}
function engineSound(){
  if(!audioOn||!audioCtx||!run)return;
  const f=70+p.s*16;
  tone(f,.045,"sawtooth",.018);
}
function startMusic(){
  if(musicTimer)clearInterval(musicTimer);
  let step=0;
  const notes=[110,110,147,165,110,110,165,196,110,147,165,220,196,165,147,110];
  musicTimer=setInterval(()=>{
    if(run&&audioOn)tone(notes[step%notes.length],.16,"triangle",.025);
    step++;
  },180);
}
function toggleAudio(){
  audioOn=!audioOn;
  document.getElementById("audioBtn").textContent=audioOn?"🔊 Audio ON":"🔇 Audio OFF";
  if(audioOn){initAudio(); if(audioCtx.state==="suspended")audioCtx.resume();}
}

const c=document.getElementById("game"),x=c.getContext("2d");let run=false,keys={},score=0,lap=1,health=100,fuel=100,dist=0,boost=100,shield=false,cool=0,road=0,enemies=[],powerups=[],bullets=[],explosions=[];
const p={x:500,y:560,w:45,h:80,s:0,max:12,a:.25,t:6};
document.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space"){e.preventDefault();fire()}})
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function startGame(){initAudio(); if(audioCtx.state==="suspended")audioCtx.resume(); menu.style.display="none";message.innerHTML="";run=true;score=0;lap=1;health=100;fuel=100;dist=0;boost=100;shield=false;cool=0;p.x=500;p.s=0;enemies=[];powerups=[];bullets=[];explosions=[];const names=["BLAZE","NITRO","VOLT","SHADOW","ROCKET"];
for(let i=0;i<5;i++) enemies.push({
  x:330+Math.random()*340,
  y:-Math.random()*1300,
  w:45,h:80,
  s:4.5+Math.random()*3,
  col:["#f33","#ff8c00","#b45cff","#72ff72","#22ddff"][i],
  hp:3,name:names[i]
});for(let i=0;i<12;i++)powerups.push({x:290+Math.random()*420,y:-Math.random()*3000,type:["boost","shield","weapon","fuel"][i%4]});requestAnimationFrame(loop)}
function rect(cx,cy,w,h,r){x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fill()}
function car(q,col){
  x.save();
  x.translate(q.x,q.y);

  // shadow
  x.fillStyle="rgba(0,0,0,.45)";
  x.beginPath();
  x.ellipse(4,8,q.w*.58,q.h*.53,0,0,Math.PI*2);
  x.fill();

  // tires
  x.fillStyle="#080808";
  x.fillRect(-q.w/2-5,-q.h*.34,9,25);
  x.fillRect(q.w/2-4,-q.h*.34,9,25);
  x.fillRect(-q.w/2-5,q.h*.12,9,25);
  x.fillRect(q.w/2-4,q.h*.12,9,25);

  // main body
  x.fillStyle=col;
  x.beginPath();
  x.moveTo(-q.w*.38,-q.h*.50);
  x.lineTo(q.w*.38,-q.h*.50);
  x.lineTo(q.w*.50,-q.h*.20);
  x.lineTo(q.w*.43,q.h*.43);
  x.quadraticCurveTo(0,q.h*.55,-q.w*.43,q.h*.43);
  x.lineTo(-q.w*.50,-q.h*.20);
  x.closePath();
  x.fill();

  // hood highlight
  x.fillStyle="rgba(255,255,255,.20)";
  x.beginPath();
  x.moveTo(-q.w*.26,-q.h*.43);
  x.lineTo(q.w*.26,-q.h*.43);
  x.lineTo(q.w*.33,-q.h*.15);
  x.lineTo(-q.w*.33,-q.h*.15);
  x.closePath();
  x.fill();

  // windshield
  x.fillStyle="#111b2a";
  x.beginPath();
  x.moveTo(-q.w*.28,-q.h*.28);
  x.lineTo(q.w*.28,-q.h*.28);
  x.lineTo(q.w*.22,-q.h*.02);
  x.lineTo(-q.w*.22,-q.h*.02);
  x.closePath();
  x.fill();

  // windshield shine
  x.fillStyle="rgba(100,220,255,.35)";
  x.beginPath();
  x.moveTo(-q.w*.20,-q.h*.24);
  x.lineTo(-q.w*.05,-q.h*.24);
  x.lineTo(-q.w*.15,-q.h*.06);
  x.lineTo(-q.w*.22,-q.h*.06);
  x.closePath();
  x.fill();

  // headlights
  x.fillStyle="#fff3a0";
  x.shadowBlur=10; x.shadowColor="#fff3a0";
  x.fillRect(-q.w*.31,-q.h*.43,10,7);
  x.fillRect(q.w*.12,-q.h*.43,10,7);
  x.shadowBlur=0;

  // rear lights
  x.fillStyle="#ff3030";
  x.fillRect(-q.w*.30,q.h*.37,10,7);
  x.fillRect(q.w*.12,q.h*.37,10,7);

  // racing stripe
  x.fillStyle="rgba(255,255,255,.75)";
  x.fillRect(-3,-q.h*.46,6,q.h*.82);

  // spoiler
  x.fillStyle="#171717";
  x.fillRect(-q.w*.40,q.h*.30,q.w*.80,5);
  x.fillRect(-q.w*.32,q.h*.22,5,14);
  x.fillRect(q.w*.27,q.h*.22,5,14);

  x.restore();
}

function roadDraw(){x.fillStyle="#246b2a";x.fillRect(0,0,c.width,c.height);x.fillStyle="#303030";x.fillRect(250,0,500,c.height);x.fillStyle="#ddd";x.fillRect(245,0,5,c.height);x.fillRect(750,0,5,c.height);for(let y=-100;y<700;y+=100){x.fillStyle="#fff";x.fillRect(495,y+road,10,55)}for(let y=-80;y<700;y+=80){x.fillStyle="#e33";x.fillRect(225,y+road,20,40);x.fillRect(755,y+road,20,40);x.fillStyle="#fff";x.fillRect(225,y+road+40,20,40);x.fillRect(755,y+road+40,20,40)}}
function pu(q){x.save();x.translate(q.x,q.y);x.shadowBlur=18;x.shadowColor=q.type==="boost"?"#0ff":q.type==="shield"?"#28f":"#f33";x.fillStyle=x.shadowColor;x.beginPath();x.arc(0,0,20,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#fff";x.font="22px Arial";x.textAlign="center";x.fillText(q.type==="boost"?"⚡":q.type==="shield"?"🛡":q.type==="weapon"?"🚀":"⛽",0,8);x.restore()}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function fire(){if(run&&cool<=0){bullets.push({x:p.x,y:p.y-45});cool=25;sfxShoot()}}
function explode(a,b){explosions.push({x:a,y:b,r:5,l:18})}
function loop(){if(!run)return;x.clearRect(0,0,c.width,c.height);roadDraw();if(keys.arrowup||keys.w)p.s+=p.a;else p.s-=.1;if(keys.arrowdown||keys.s)p.s-=.35;p.s=Math.max(0,Math.min(p.max,p.s));
if(p.s>0){fuel-=0.018*p.s;if(fuel<=0){fuel=0;p.s=Math.max(0,p.s-.25)}}else{fuel=Math.min(100,fuel+.03)}
if((keys.shift||keys.e)&&boost>0){p.s=Math.min(18,p.s+.5);boost-=.8;if(Math.random()<.08)sfxBoost()}if(keys.arrowleft||keys.a)p.x-=p.t;if(keys.arrowright||keys.d)p.x+=p.t;p.x=Math.max(275,Math.min(725,p.x));road+=p.s;dist+=p.s;if(dist>5000){dist=0;lap++;score+=1000;if(lap>3)return win()}
powerups.forEach(q=>{q.y+=p.s;pu(q)});powerups=powerups.filter(q=>q.y<800);if(powerups.length<7)powerups.push({x:290+Math.random()*420,y:-500,type:["boost","shield","weapon","fuel"][Math.floor(Math.random()*4)]});
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=p.s-e.s;e.x+=Math.sign(p.x-e.x)*.45;if(e.y>800){e.y=-200-Math.random()*500;e.x=330+Math.random()*340;score+=100}if(hit(p,e)){explode(p.x,p.y);sfxHit();if(shield)shield=false;else health-=10;e.y-=200;p.s*=.5}car(e,e.col);
x.fillStyle="#fff";
x.font="bold 12px Arial";
x.textAlign="center";
x.fillText(e.name,e.x,e.y-50);
}
for(let i=powerups.length-1;i>=0;i--){let q=powerups[i];if(Math.abs(p.x-q.x)<40&&Math.abs(p.y-q.y)<60){if(q.type==="boost"){boost=100;score+=100}if(q.type==="shield"){shield=true;score+=150}if(q.type==="weapon"){cool=0;score+=200}if(q.type==="fuel"){fuel=Math.min(100,fuel+40);score+=250} sfxPower();powerups.splice(i,1)}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.y-=15;x.fillStyle="#ffea00";x.fillRect(b.x-4,b.y,8,20);for(let j=0;j<enemies.length;j++){let e=enemies[j];if(b.x>e.x-e.w/2&&b.x<e.x+e.w/2&&b.y>e.y-e.h/2&&b.y<e.y+e.h/2){e.hp--;explode(e.x,e.y);sfxHit();bullets.splice(i,1);if(e.hp<=0){score+=500;sfxExplosion();e.y=-500-Math.random()*1000;e.hp=3}break}}if(b.y<-30)bullets.splice(i,1)}
for(let i=explosions.length-1;i>=0;i--){let e=explosions[i];e.r+=3;e.l--;x.fillStyle="rgba(255,120,0,.7)";x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();if(e.l<=0)explosions.splice(i,1)}
if(Math.random()<.10)engineSound();
car(p,"#00eaff");
x.fillStyle="#fff";
x.font="bold 12px Arial";
x.textAlign="center";
x.fillText("YOU",p.x,p.y-50);
if(shield){x.strokeStyle="#39f";x.lineWidth=5;x.beginPath();x.arc(p.x,p.y,48,0,Math.PI*2);x.stroke()}if(cool>0)cool--;hud();if(health<=0)return lose();requestAnimationFrame(loop)}
function hud(){document.getElementById("lap").textContent=Math.min(lap,3);document.getElementById("health").textContent=Math.max(0,health);document.getElementById("fuel").textContent=Math.floor(fuel);document.getElementById("boost").textContent=Math.floor(boost)+"%";document.getElementById("shield").textContent=shield?"ACTIVE":"OFF";document.getElementById("weapon").textContent=cool<=0?"READY":"RECHARGING";document.getElementById("score").textContent=score}
function win(){run=false;sfxWin();message.innerHTML="🏆 YOU WIN! 🏆<br><small>Score: "+score+"</small>";setTimeout(()=>menu.style.display="flex",2500)}
function lose(){run=false;sfxLose();message.innerHTML="💥 GAME OVER 💥<br><small>Score: "+score+"</small>";setTimeout(()=>menu.style.display="flex",2500)}
</script>
</body>
</html>
